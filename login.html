<!DOCTYPE html>
<html>
<head>
    <title>Baby Dudu Docs - Log In</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* LOGIN CONTAINER CARD */
        .login-card {
            display: flex;
            flex-direction: column;
            width: 900px;
            max-width: 100%;
            background-color: #ffffff;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid #f8fafc;
        }

        @media (min-width: 768px) {
            .login-card {
                flex-direction: row;
            }
        }

        /* LEFT BLUE PANEL */
        .welcome-panel {
            width: 100%;
            padding: 2.5rem;
            color: #ffffff;
            background: linear-gradient(to bottom right, #2563eb, #1d4ed8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @media (min-width: 768px) {
            .welcome-panel {
                width: 50%;
            }
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
        }

        .brand-icon {
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            border-radius: 0.75rem;
            font-size: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .brand-name {
            font-size: 1.125rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 1rem;
        }

        .welcome-desc {
            font-size: 0.75rem;
            line-height: 1.6;
            color: rgba(219, 234, 254, 0.9);
        }

        /* RIGHT FORM PANEL */
        .form-panel {
            width: 100%;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (min-width: 768px) {
            .form-panel {
                width: 50%;
                padding: 2.5rem;
            }
        }

        .form-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }

        .form-subtitle {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }

        /* FORM ELEMENTS */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.375rem;
        }

        .text-input {
            width: 100%;
            height: 2.5rem;
            padding: 0 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            outline: none;
            background-color: rgba(248, 250, 252, 0.5);
            font-size: 0.75rem;
            color: #1e293b;
            transition: all 0.2s ease;
        }

        .text-input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-extras {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            padding-top: 0.25rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #475569;
            cursor: pointer;
        }

        .checkbox-input {
            width: 1rem;
            height: 1rem;
            border-radius: 0.25rem;
            border: 1px solid #cbd5e1;
            accent-color: #2563eb;
        }

        .forgot-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            height: 2.75rem;
            margin-top: 0.5rem;
            border: none;
            border-radius: 0.75rem;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.25);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <!-- LOGIN CONTAINER CARD -->
    <div class="login-card">

        <!-- LEFT BLUE PANEL -->
        <section class="welcome-panel">
            <div>
                <!-- Brand Logo / Name -->
                <div class="brand-box">
                    <div class="brand-icon">🩺</div>
                    <span class="brand-name">Baby Dudu Docs</span>
                </div>

                <!-- Headline -->
                <h1 class="welcome-title">Clinic Management Portal</h1>

                <!-- Description -->
                <p class="welcome-desc">
                    Seamless patient relationship management, appointment scheduling, inquiry resolution, and healthcare staff analytics in one unified platform.
                </p>
            </div>
        </section>

        <!-- RIGHT FORM PANEL -->
        <section class="form-panel">

            <!-- Title & Subtitle -->
            <h2 class="form-title">Sign in to your account</h2>
            <p class="form-subtitle">Enter your credentials to access the portal.</p>

            <!-- LOGIN FORM -->
            <form onsubmit="handleLogin(event)" class="login-form">
                
                <!-- Email Field -->
                <div class="input-group">
                    <label for="email" class="input-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        value="reception@gmail.com" 
                        required 
                        class="text-input"
                    >
                </div>

                <!-- Password Field -->
                <div class="input-group">
                    <label for="password" class="input-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        value="password123" 
                        required 
                        class="text-input"
                    >
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-extras">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" class="checkbox-input">
                        Remember me
                    </label>
                    <a href="#" onclick="alert('Password reset link sent.'); return false;" class="forgot-link">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">
                    Sign In
                </button>
            </form>

        </section>
    </div>

    <!-- JAVASCRIPT HELPERS -->
    <script>
        
    function handleLogin(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (email === "reception@gmail.com" && password === "password123") {
            window.location.href = "index.html";
        } else {
            alert("Invalid email or password!");
        }
    }

    </script>
</body>
</html>
