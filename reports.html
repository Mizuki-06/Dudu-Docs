<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Baby Dudu Docs</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        bgSoft: '#f4f6fb',
                        cardBg: '#ffffff'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Font Inter -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js for Reports -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
<script>
// Preserve existing locally saved clinic data after the brand rename.
(function(){
 const keys = ['youcare_doctors', 'youcare_patients', 'youcare_inquiries', 'youcare_feedback', 'youcare_activities', 'youcare_settings', 'youcare_appearance'];
 keys.forEach(function(oldKey){
   const newKey = oldKey.replace('youcare_', 'babydududocs_');
   if (localStorage.getItem(newKey) === null && localStorage.getItem(oldKey) !== null) {
     localStorage.setItem(newKey, localStorage.getItem(oldKey));
   }
 });
})();
</script>
</head>
<body class="bg-bgSoft min-h-screen text-slate-800 flex flex-col" data-page="reports">

    <!-- TOP NAVBAR -->
    <header class="bg-white border-b border-slate-200/80 sticky top-0 z-40 px-4 sm:px-8 py-3 flex items-center justify-between shadow-sm">
        <!-- Logo -->
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('dashboard')" data-page-link="dashboard">
            <img src="./images/babydududocslogo.jpg" alt="Baby Dudu Docs clinic logo" class="w-12 h-12 rounded-full object-cover border border-slate-200 bg-white">
            <span class="text-lg sm:text-xl font-bold tracking-tight text-slate-900">Baby Dudu Docs</span>
        </div>

        <!-- Central Navigation Pills -->
        <nav class="hidden md:flex items-center bg-slate-100/80 p-1.5 rounded-full border border-slate-200/60 gap-1">
            <button onclick="switchTab('dashboard')" data-page-link="dashboard" id="nav-dashboard" class="tab-pill px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900">Dashboard</button>
            <button onclick="switchTab('patients')" data-page-link="patients" id="nav-patients" class="tab-pill px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900">Patient</button>
            <button onclick="switchTab('appointments')" data-page-link="appointments" id="nav-appointments" class="tab-pill px-5 py-2 rounded-full text-sm font-medium bg-brand-600 text-white shadow-sm">Appointment</button>
            <button onclick="switchTab('reports')" data-page-link="reports" id="nav-reports" class="tab-pill px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900">Report</button>
            <button onclick="switchTab('inquiries')" data-page-link="inquiries" id="nav-inquiries" class="tab-pill px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900 relative">
                Inquiries
                <span id="badge-inquiries" class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-rose-500 rounded-full"></span>
            </button>
            <button onclick="switchTab('staff')" data-page-link="staff" id="nav-staff" class="tab-pill px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900">Staff</button>
        </nav>

        <!-- User Actions & Profile -->
        <div class="flex items-center gap-3">
            <button onclick="switchTab('inquiries')" data-page-link="inquiries" class="w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition relative">
                <i data-lucide="bell" class="w-4 h-4"></i>
                <span class="absolute top-2 right-2 w-2 h-2 bg-brand-600 rounded-full"></span>
            </button>
            <button id="settings-nav-button" onclick="switchTab('settings')" data-page-link="settings" aria-label="Settings" title="Settings" aria-pressed="false" class="settings-nav-button w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition">
                <i data-lucide="settings" class="w-4 h-4"></i>
            </button>
            
            <div class="flex items-center gap-2 pl-2 border-l border-slate-200">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=120" alt="User Profile" class="w-9 h-9 rounded-full object-cover border border-brand-500">
                <div class="hidden sm:block text-left text-xs">
                    <p class="font-semibold text-slate-800" id="current-user-name">Dr. Sarah Jenkins</p>
                    <p class="text-slate-500" id="current-user-role">Head Admin</p>
                </div>
            </div>
        </div>
    </header>

    <!-- MOBILE NAVIGATION (Visible on small screens) -->
    <div class="mobile-navigation md:hidden bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-around text-xs font-medium overflow-x-auto">
        <button onclick="switchTab('dashboard')" data-page-link="dashboard" class="py-1 px-3 text-slate-600">Dashboard</button>
        <button onclick="switchTab('patients')" data-page-link="patients" class="py-1 px-3 text-slate-600">Patient</button>
        <button onclick="switchTab('appointments')" data-page-link="appointments" class="py-1 px-3 bg-brand-600 text-white rounded-full">Appointment</button>
        <button onclick="switchTab('reports')" data-page-link="reports" class="py-1 px-3 text-slate-600">Report</button>
        <button onclick="switchTab('inquiries')" data-page-link="inquiries" class="py-1 px-3 text-slate-600">Inquiries</button>
        <button onclick="switchTab('staff')" data-page-link="staff" class="py-1 px-3 text-slate-600">Staff</button>
        <button onclick="switchTab('settings')" data-page-link="settings" class="py-1 px-3 text-slate-600">Settings</button>
    </div>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
<section id="section-reports" class="space-y-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Analytics & Reports</h1>
                    <p class="text-slate-500 text-sm">Comprehensive performance metrics and appointment service trends.</p>
                </div>
                <button onclick="exportDataExcel()" class="flex items-center gap-2 px-4 py-2 border border-slate-200 bg-white rounded-2xl text-xs font-semibold text-slate-700 hover:bg-slate-50 shadow-sm">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i> Export Full Report
                </button>
            </div>

            <!-- Analytics Cards Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Frequently Requested Services Chart -->
                <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-base">Frequently Requested Services</h3>
                    <div class="h-64 flex items-center justify-center">
                        <canvas id="servicesChart"></canvas>
                    </div>
                </div>

                <!-- Appointment Status Breakdown -->
                <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-base">Appointment Resolution Rate</h3>
                    <div class="h-64 flex items-center justify-center">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- TOAST NOTIFICATION BANNER -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs font-semibold pointer-events-none">
        <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
        <span id="toast-message">Action saved successfully!</span>
    </div>
    <script src="app.js"></script>
</body>
</html>
