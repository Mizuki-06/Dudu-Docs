<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients | Baby Dudu Docs</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        bgSoft: '#f4f6fb',
                        cardBg: '#ffffff'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Font Inter -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js for Reports -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
<script>
// Preserve existing locally saved clinic data after the brand rename.
(function(){
 const keys = ['youcare_doctors', 'youcare_inquiries', 'youcare_feedback', 'youcare_activities', 'youcare_settings', 'youcare_appearance'];
 keys.forEach(function(oldKey){
   const newKey = oldKey.replace('youcare_', 'babydududocs_');
   if (localStorage.getItem(newKey) === null && localStorage.getItem(oldKey) !== null) {
     localStorage.setItem(newKey, localStorage.getItem(oldKey));
   }
 });
})();
</script>
</head>
<body class="bg-bgSoft min-h-screen text-slate-800 flex flex-col" data-page="patients">

    <!-- TOP NAVBAR -->
    <header class="bg-white border-b border-slate-200/80 sticky top-0 z-40 px-4 sm:px-8 py-3 flex items-center justify-between shadow-sm">
        <!-- Logo -->
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('dashboard')" data-page-link="dashboard">
            <img src="./images/babydududocslogo.jpg" alt="Baby Dudu Docs clinic logo" class="w-12 h-12 rounded-full object-cover border border-slate-200 bg-white">
            <span class="text-lg sm:text-xl font-bold tracking-tight text-slate-900">Baby Dudu Docs</span>
        </div>

        <!-- Central Navigation Pills -->
        <nav class="hidden md:flex items-center bg-slate-100/80 p-1.5 rounded-full border border-slate-200/60 gap-1">
            <button onclick="switchTab('dashboard')" data-page-link="dashboard" id="nav-dashboard" class="tab-pill px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900">Dashboard</button>
            <button onclick="switchTab('patients')" data-page-link="patients" id="nav-patients" class="tab-pill px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900">Patient</button>
            <button onclick="switchTab('appointments')" data-page-link="appointments" id="nav-appointments" class="tab-pill px-5 py-2 rounded-full text-sm font-medium bg-brand-600 text-white shadow-sm">Appointment</button>
            <button onclick="switchTab('reports')" data-page-link="reports" id="nav-reports" class="tab-pill px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900">Report</button>
            <button onclick="switchTab('inquiries')" data-page-link="inquiries" id="nav-inquiries" class="tab-pill px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900 relative">
                Inquiries
                <span id="badge-inquiries" class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-rose-500 rounded-full"></span>
            </button>
            <button onclick="switchTab('staff')" data-page-link="staff" id="nav-staff" class="tab-pill px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900">Staff</button>
        </nav>

        <!-- User Actions & Profile -->
        <div class="flex items-center gap-3">
            
            <button id="settings-nav-button" onclick="switchTab('settings')" data-page-link="settings" aria-label="Settings" title="Settings" aria-pressed="false" class="settings-nav-button w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition">
                <i data-lucide="settings" class="w-4 h-4"></i>
            </button>
            
            <div class="flex items-center gap-2 pl-2 border-l border-slate-200">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=120" alt="User Profile" class="w-9 h-9 rounded-full object-cover border border-brand-500">
                <div class="hidden sm:block text-left text-xs">
                    <p class="font-semibold text-slate-800" id="current-user-name">Dr. Sarah Jenkins</p>
                    <p class="text-slate-500" id="current-user-role">Head Admin</p>
                </div>
            </div>
        </div>
    </header>

    <!-- MOBILE NAVIGATION (Visible on small screens) -->
    <div class="mobile-navigation md:hidden bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-around text-xs font-medium overflow-x-auto">
        <button onclick="switchTab('dashboard')" data-page-link="dashboard" class="py-1 px-3 text-slate-600">Dashboard</button>
        <button onclick="switchTab('patients')" data-page-link="patients" class="py-1 px-3 text-slate-600">Patient</button>
        <button onclick="switchTab('appointments')" data-page-link="appointments" class="py-1 px-3 bg-brand-600 text-white rounded-full">Appointment</button>
        <button onclick="switchTab('reports')" data-page-link="reports" class="py-1 px-3 text-slate-600">Report</button>
        <button onclick="switchTab('inquiries')" data-page-link="inquiries" class="py-1 px-3 text-slate-600">Inquiries</button>
        <button onclick="switchTab('staff')" data-page-link="staff" class="py-1 px-3 text-slate-600">Staff</button>
        <button onclick="switchTab('settings')" data-page-link="settings" class="py-1 px-3 text-slate-600">Settings</button>
    </div>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
<section id="section-patients" class="space-y-6">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Patient Directory</h1>
                    <p class="text-slate-500 text-sm">Manage patient records, medical histories, and contact info.</p>
                </div>
                <button onclick="openAddPatientModal()" class="flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-2xl font-semibold shadow-md shadow-brand-500/20 text-xs">
                    <i data-lucide="user-plus" class="w-4 h-4"></i> Add New Patient
                </button>
            </div>

            <!-- Table Container -->
            <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                    <div class="relative w-72">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                        <input type="text" id="patient-search-input" onkeyup="renderPatientsTable()" placeholder="Search by name, email, or phone..." class="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-600">
                        <thead class="bg-slate-50 border-b border-slate-100 text-slate-400 font-semibold uppercase tracking-wider">
                            <tr>
                                <th class="p-4">Patient Name</th>
                                <th class="p-4">Contact Info</th>
                                <th class="p-4">Age / Gender</th>
                                <th class="p-4">Blood Group</th>
                                <th class="p-4">Last Visit</th>
                                <th class="p-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100" id="patients-table-body">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <!-- MODAL 2: Add New Patient Modal -->
    <div id="modal-add-patient" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl border border-slate-200 max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 id="patient-modal-title" class="font-bold text-slate-800 text-lg">Add New Patient Record</h3>
                <button onclick="closeModal('modal-add-patient')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <form id="patient-form" novalidate onsubmit="handleSavePatient(event)" class="space-y-4 text-xs">
                <input type="hidden" id="patient-id">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label for="patient-name" class="block font-semibold text-slate-700 mb-1">Full Name</label>
                        <input type="text" id="patient-name" name="full_name" required aria-describedby="patient-name-error" oninput="validatePatientField('patient-name')" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <p id="patient-name-error" class="mt-1 hidden text-rose-600" aria-live="polite"></p>
                    </div>
                    <div>
                        <label for="patient-date-of-birth" class="block font-semibold text-slate-700 mb-1">Date of Birth</label>
                        <input type="date" id="patient-date-of-birth" name="date_of_birth" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label for="patient-gender" class="block font-semibold text-slate-700 mb-1">Sex</label>
                        <select id="patient-gender" name="sex" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 focus:outline-none">
                            <option value="">Select sex</option>
                            <option>Female</option>
                            <option>Male</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div>
                        <label for="patient-phone" class="block font-semibold text-slate-700 mb-1">Contact Number</label>
                        <input type="tel" id="patient-phone" name="contact_number" required inputmode="tel" aria-describedby="patient-phone-error" oninput="validatePatientField('patient-phone')" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <p id="patient-phone-error" class="mt-1 hidden text-rose-600" aria-live="polite"></p>
                    </div>
                    <div class="sm:col-span-2">
                        <label for="patient-email" class="block font-semibold text-slate-700 mb-1">Email</label>
                        <input type="email" id="patient-email" name="email" aria-describedby="patient-email-error" oninput="validatePatientField('patient-email')" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <p id="patient-email-error" class="mt-1 hidden text-rose-600" aria-live="polite"></p>
                    </div>
                    <div class="sm:col-span-2">
                        <label for="patient-address" class="block font-semibold text-slate-700 mb-1">Address</label>
                        <textarea id="patient-address" name="address" rows="2" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                    </div>
                    <div>
                        <label for="patient-allergies" class="block font-semibold text-slate-700 mb-1">Allergies</label>
                        <textarea id="patient-allergies" name="allergies" rows="2" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                    </div>
                    <div>
                        <label for="patient-medical-history" class="block font-semibold text-slate-700 mb-1">Medical History</label>
                        <textarea id="patient-medical-history" name="medical_history" rows="2" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                    </div>
                    <div>
                        <label for="patient-last-visit" class="block font-semibold text-slate-700 mb-1">Last Visit</label>
                        <input type="date" id="patient-last-visit" name="last_visit" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label for="patient-status" class="block font-semibold text-slate-700 mb-1">Status</label>
                        <select id="patient-status" name="status" required class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <div>
                        <label for="patient-age" class="block font-semibold text-slate-700 mb-1">Age</label>
                        <input type="text" id="patient-age" name="age" inputmode="numeric" pattern="[0-9]*" aria-describedby="patient-age-error" oninput="validatePatientField('patient-age')" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <p id="patient-age-error" class="mt-1 hidden text-rose-600" aria-live="polite"></p>
                    </div>
                    <div>
                        <label for="patient-blood" class="block font-semibold text-slate-700 mb-1">Blood Group</label>
                        <select id="patient-blood" name="blood_group" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 focus:outline-none">
                            <option value="">Select blood group</option>
                            <option>A+</option><option>A-</option>
                            <option>B+</option><option>B-</option>
                            <option>AB+</option><option>AB-</option>
                            <option>O+</option><option>O-</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeModal('modal-add-patient')" class="px-4 py-2 rounded-xl border border-slate-200 font-semibold text-slate-600 hover:bg-slate-50">Cancel</button>
                    <button id="patient-submit-button" type="submit" class="px-5 py-2 rounded-xl font-semibold bg-brand-600 text-white shadow-md hover:bg-brand-700">Save Record</button>
                </div>
            </form>
        </div>
    </div>
    <div id="modal-patient-details" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl border border-slate-200 max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 id="patient-details-title" class="font-bold text-slate-800 text-lg">Patient Details</h3>
                <button type="button" onclick="closeModal('modal-patient-details')" class="text-slate-400 hover:text-slate-600" aria-label="Close patient details"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <dl id="patient-details-content" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs"></dl>
        </div>
    </div>
    <!-- TOAST NOTIFICATION BANNER -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs font-semibold pointer-events-none">
        <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
        <span id="toast-message">Action saved successfully!</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="patients.js"></script>
    <script src="app.js"></script>
</body>
</html>
